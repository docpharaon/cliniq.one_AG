<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>cliniq.one — Patient App</title>
    <meta name="description" content="cliniq.one patient medical consultation app — AI-powered intake, doctor review, and telemedicine." />
    <link rel="icon" href="/favicon.ico" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: #050810;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse 60% 40% at 50% 0%, rgba(45, 212, 191, 0.08), transparent),
                radial-gradient(ellipse 40% 50% at 80% 100%, rgba(99, 102, 241, 0.06), transparent),
                radial-gradient(ellipse 50% 40% at 20% 80%, rgba(45, 212, 191, 0.04), transparent);
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
        }

        .phone-frame {
            position: relative;
            width: 375px;
            height: 812px;
            border-radius: 52px;
            background: linear-gradient(145deg, #1a1a2e, #0d0d1a);
            padding: 12px;
            box-shadow:
                0 0 0 1px rgba(255,255,255,0.08),
                0 20px 60px rgba(0,0,0,0.6),
                0 0 80px rgba(45, 212, 191, 0.08),
                inset 0 1px 0 rgba(255,255,255,0.05);
        }

        .phone-frame::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 120px;
            height: 32px;
            background: #0d0d1a;
            border-radius: 0 0 20px 20px;
            z-index: 10;
        }

        .phone-frame::after {
            content: '';
            position: absolute;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            width: 100px;
            height: 28px;
            background: #000;
            border-radius: 20px;
            z-index: 11;
        }

        .phone-screen {
            width: 100%;
            height: 100%;
            border-radius: 40px;
            overflow: hidden;
            background: #0A0E1A;
        }

        .phone-screen iframe {
            width: 100%;
            height: 100%;
            border: none;
            border-radius: 40px;
        }

        .btn-power {
            position: absolute;
            right: -3px;
            top: 180px;
            width: 4px;
            height: 80px;
            background: linear-gradient(180deg, #2a2a3e, #1a1a2e);
            border-radius: 0 3px 3px 0;
        }
        .btn-vol-up {
            position: absolute;
            left: -3px;
            top: 160px;
            width: 4px;
            height: 40px;
            background: linear-gradient(180deg, #2a2a3e, #1a1a2e);
            border-radius: 3px 0 0 3px;
        }
        .btn-vol-down {
            position: absolute;
            left: -3px;
            top: 210px;
            width: 4px;
            height: 40px;
            background: linear-gradient(180deg, #2a2a3e, #1a1a2e);
            border-radius: 3px 0 0 3px;
        }
        .btn-silent {
            position: absolute;
            left: -3px;
            top: 120px;
            width: 4px;
            height: 24px;
            background: linear-gradient(180deg, #2a2a3e, #1a1a2e);
            border-radius: 3px 0 0 3px;
        }

        .branding {
            text-align: center;
        }
        .branding h1 {
            font-size: 20px;
            font-weight: 800;
            background: linear-gradient(135deg, #2dd4bf, #6366f1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.5px;
        }
        .branding p {
            color: rgba(255,255,255,0.35);
            font-size: 12px;
            font-weight: 500;
            margin-top: 4px;
        }

        @media (max-width: 420px) {
            body { background: #0A0E1A; }
            body::before { display: none; }
            .container { gap: 0; }
            .phone-frame {
                width: 100vw;
                height: 100vh;
                border-radius: 0;
                padding: 0;
                box-shadow: none;
                background: none;
            }
            .phone-frame::before, .phone-frame::after,
            .btn-power, .btn-vol-up, .btn-vol-down, .btn-silent { display: none; }
            .phone-screen { border-radius: 0; }
            .phone-screen iframe { border-radius: 0; }
            .branding { display: none; }
        }

        @media (max-height: 900px) and (min-width: 420px) {
            .phone-frame {
                transform: scale(0.85);
                transform-origin: center center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="phone-frame">
            <div class="btn-power"></div>
            <div class="btn-vol-up"></div>
            <div class="btn-vol-down"></div>
            <div class="btn-silent"></div>
            <div class="phone-screen">
                <iframe src="/landing.html" title="cliniq.one Patient App" allow="camera;microphone"></iframe>
            </div>
        </div>
        <div class="branding">
            <h1>cliniq.one</h1>
            <p>AI-Powered Medical Consultations</p>
        </div>
    </div>
</body>
</html>
