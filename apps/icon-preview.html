<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ClinIQ Icon Preview</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#fff;--bg2:#F5F8FA;--text:#1E293B;--text2:#64748B;--text3:#94A3B8;--teal:#1A8A9E;--border:#DEE5ED;--card:#fff}
.dark{--bg:#0A0E1A;--bg2:#111827;--text:#F1F5F9;--text2:#94A3B8;--text3:#64748B;--teal:#2DD4BF;--border:#1E293B;--card:#1E293B}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);transition:all .3s}
.header{display:flex;justify-content:space-between;align-items:center;padding:24px 32px;border-bottom:1px solid var(--border)}
.header h1{font-size:24px;font-weight:700}
.header h1 span{color:var(--teal)}
.toggle{padding:8px 16px;border-radius:8px;border:1px solid var(--border);background:var(--bg2);color:var(--text);cursor:pointer;font-family:inherit;font-size:13px;font-weight:600}
.content{max-width:1200px;margin:0 auto;padding:32px}
.category{margin-bottom:40px}
.category h2{font-size:16px;font-weight:700;color:var(--teal);margin-bottom:16px;text-transform:uppercase;letter-spacing:1px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:12px}
.icon-card{display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 8px;border-radius:12px;background:var(--bg2);border:1px solid var(--border);transition:all .2s}
.icon-card:hover{border-color:var(--teal);transform:translateY(-2px);box-shadow:0 4px 12px rgba(26,138,158,.15)}
.icon-card svg{color:var(--teal)}
.icon-card .label{font-size:10px;color:var(--text3);text-align:center;font-weight:500}
.icon-card .emoji{font-size:10px;color:var(--text2)}
.sizes{display:flex;align-items:center;gap:20px;padding:20px 32px;background:var(--bg2);border-bottom:1px solid var(--border)}
.sizes span{font-size:12px;color:var(--text3);font-weight:600}
.size-demo{display:flex;align-items:center;gap:12px;color:var(--teal)}
</style>
</head>

  <button class="toggle" onclick="document.body.classList.toggle('dark');this.textContent=document.body.classList.contains('dark')?'☀ Light Mode':'◑ Dark Mode'">◑ Dark Mode</button>
</div>
<div class="sizes">
  <span>SIZE SCALE:</span>
  <div class="size-demo" id="sizeDemo"></div>
</div>
<div class="content" id="content"></div>

// Render size demos
const sizeEl = document.getElementById('sizeDemo');
[14,16,20,24,32].forEach(sz => {
  sizeEl.innerHTML += `<div style="display:flex;align-items:center;gap:4px">${S('<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>',sz)}<span style="font-size:10px;color:var(--text3)">${sz}px</span></div>`;
});

// Render icon grid
const content = document.getElementById('content');
for (const [cat, iconMap] of Object.entries(icons)) {
  let html = `<div class="category"><h2>${cat}</h2><div class="grid">`;
  for (const [nameEmoji, paths] of Object.entries(iconMap)) {
    const [name, emoji] = nameEmoji.split('|');
    html += `<div class="icon-card">${S(paths, 28)}<div class="label">${name}</div><div class="emoji">was: ${emoji}</div></div>`;
  }
  html += '</div></div>';
  content.innerHTML += html;
}

</html>
