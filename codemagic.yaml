# ────────────────────────────────────────────────────────────
# Codemagic CI/CD — iOS Builds for cliniq.one Capacitor Apps
# ────────────────────────────────────────────────────────────
# Docs: https://docs.codemagic.io/yaml/yaml-getting-started/
#
# Required Codemagic environment variable groups (set in Codemagic UI):
#   Group: app_store_credentials
#     APP_STORE_CONNECT_ISSUER_ID
#     APP_STORE_CONNECT_KEY_ID
#     APP_STORE_CONNECT_PRIVATE_KEY (.p8 contents)
#   Group: supabase_credentials
#     NEXT_PUBLIC_SUPABASE_URL
#     NEXT_PUBLIC_SUPABASE_ANON_KEY
#     EXPO_PUBLIC_SUPABASE_URL       (for patient app)
#     EXPO_PUBLIC_SUPABASE_ANON_KEY  (for patient app)
# ────────────────────────────────────────────────────────────

# ─── DOCTOR iOS ─────────────────────────────────────────────
workflows:
  doctor-ios:
    name: Doctor iOS
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: codemagic
    environment:
      xcode: latest
      node: 20
      cocoapods: default
      groups:
        - app_store_credentials
        - supabase_credentials
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.cliniqone.doctor
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
      cancel_previous_builds: true
    scripts:
      - name: Install dependencies
        script: npm ci
      - name: Build doctor-web
        script: |
          cd apps/doctor-web
          npm run build
      - name: Add and sync iOS platform
        script: |
          cd apps/doctor-capacitor
          if [ ! -d "ios" ]; then
            npx cap add ios
          fi
          npx cap sync ios
      - name: Install CocoaPods
        script: |
          cd apps/doctor-capacitor/ios/App
          pod install
      - name: Build IPA
        script: |
          cd apps/doctor-capacitor
          xcode-project build-ipa \
            --workspace "ios/App/App.xcworkspace" \
            --scheme "App"
    artifacts:
      - apps/doctor-capacitor/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - Cliniq Testers

