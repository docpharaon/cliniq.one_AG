# ────────────────────────────────────────────────────────────
# Codemagic CI/CD — iOS Builds for cliniq.one Capacitor Apps
# ────────────────────────────────────────────────────────────
# Required env var groups (set in Codemagic UI):
#   supabase_credentials: NEXT_PUBLIC_SUPABASE_URL, NEXT_PUBLIC_SUPABASE_ANON_KEY,
#                         EXPO_PUBLIC_SUPABASE_URL, EXPO_PUBLIC_SUPABASE_ANON_KEY
# ────────────────────────────────────────────────────────────

workflows:
  # ─── DOCTOR iOS ─────────────────────────────────────────────
  doctor-ios:
    name: Doctor iOS
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: codemagic
    environment:
      xcode: latest
      node: 20
      cocoapods: default
      groups:
        - supabase_credentials
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
      cancel_previous_builds: true
    scripts:
      - name: Install dependencies
        script: npm ci
      - name: Build doctor-web
        script: |
          cd apps/doctor-web
          npm run build
      - name: Add and sync iOS platform
        script: |
          cd apps/doctor-capacitor
          if [ ! -d "ios" ]; then
            npx cap add ios
          fi
          npx cap sync ios
      - name: Install CocoaPods
        script: |
          cd apps/doctor-capacitor/ios/App
          pod install
      - name: Set up code signing
        script: |
          app-store-connect fetch-signing-files "com.cliniqone.doctor" \
            --type IOS_APP_STORE \
            --create
          keychain initialize
          app-store-connect certificates list \
            --type IOS_DISTRIBUTION \
            --certificate-key=@file:${HOME}/Library/MobileDevice/Certificates/*.p12 \
            2>/dev/null || app-store-connect certificates create \
            --type IOS_DISTRIBUTION \
            --save
          keychain add-certificates
          xcode-project use-profiles
      - name: Build IPA
        script: |
          cd apps/doctor-capacitor
          xcode-project build-ipa \
            --workspace "ios/App/App.xcworkspace" \
            --scheme "App"
    artifacts:
      - apps/doctor-capacitor/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - Cliniq Testers

