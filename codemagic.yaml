# ────────────────────────────────────────────────────────────
# Codemagic CI/CD — iOS Builds for cliniq.one Capacitor Apps
# ────────────────────────────────────────────────────────────
# Each app builds its web source first, then bundles it into
# the native binary via `cap sync`. No server.url dependency.
# ────────────────────────────────────────────────────────────

workflows:
  # ─── DOCTOR iOS ─────────────────────────────────────────────
  doctor-ios:
    name: Doctor iOS
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: codemagic
    environment:
      xcode: latest
      node: 22
      groups:
        - supabase_credentials
    triggering:
      events: []
      cancel_previous_builds: true
    scripts:
      - name: Install dependencies
        script: npm ci --legacy-peer-deps
      - name: Build doctor-web (static export)
        script: |
          cd apps/doctor-web
          CAPACITOR_BUILD=1 npx next build
          echo "=== doctor-web/out contents ==="
          ls -la out/ | head -20
      - name: Add and sync iOS platform
        script: |
          cd apps/doctor-capacitor
          ../../node_modules/.bin/cap add ios 2>&1 || echo "cap add finished (may already exist)"
          ../../node_modules/.bin/cap sync ios
          echo "=== iOS files generated ==="
          find ios -name "*.xcworkspace" -o -name "*.xcodeproj" 2>/dev/null | head -10
      - name: Debug - list iOS project structure
        script: |
          echo "=== iOS project structure ==="
          ls -la apps/doctor-capacitor/ios/App/ || echo "ios/App not found"
          echo "=== Looking for xcworkspace ==="
          find apps/doctor-capacitor/ios -name "*.xcworkspace" -o -name "*.xcodeproj" 2>/dev/null || echo "No xcode projects found"
      - name: Set up code signing
        script: |
          openssl genrsa -out /tmp/cert_key.pem 2048
          export CERTIFICATE_PRIVATE_KEY=$(cat /tmp/cert_key.pem)
          keychain initialize
          app-store-connect fetch-signing-files "com.cliniqone.doctor" \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates

          # Extract provisioning profile UUID + Team ID directly from the file
          PP_PATH=$(find ~/Library/Developer/Xcode/UserData/Provisioning\ Profiles ~/Library/MobileDevice/Provisioning\ Profiles -name "*.mobileprovision" 2>/dev/null | head -1)
          if [ -z "$PP_PATH" ]; then echo "ERROR: No provisioning profile found after fetch"; exit 1; fi
          security cms -D -i "$PP_PATH" > /tmp/pp.plist
          PP_UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" /tmp/pp.plist)
          TEAM_ID=$(/usr/libexec/PlistBuddy -c "Print :TeamIdentifier:0" /tmp/pp.plist)
          echo "Profile UUID: $PP_UUID  Team ID: $TEAM_ID"
          printf '%s' "$PP_UUID" > /tmp/pp_uuid.txt
          printf '%s' "$TEAM_ID" > /tmp/team_id.txt

          # Patch pbxproj: Manual signing + inject Team ID
          find apps/doctor-capacitor/ios -name "project.pbxproj" | while read pbxf; do
            perl -i -pe "s/CODE_SIGN_STYLE = Automatic/CODE_SIGN_STYLE = Manual/g; s/DEVELOPMENT_TEAM = [^;]*;/DEVELOPMENT_TEAM = $TEAM_ID;/g;" "$pbxf"
            echo "Patched: $pbxf"
          done

          xcode-project use-profiles
      - name: Patch Info.plist
        script: |
          PLIST="apps/doctor-capacitor/ios/App/App/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$PLIST" 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Set :ITSAppUsesNonExemptEncryption false" "$PLIST"
          /usr/libexec/PlistBuddy -c "Delete :UIRequiredDeviceCapabilities" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UIRequiredDeviceCapabilities array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UIRequiredDeviceCapabilities:0 string arm64" "$PLIST"
          echo "=== Patched Info.plist ==="
          cat "$PLIST"
      - name: Build IPA
        script: |
          cd apps/doctor-capacitor/ios/App
          PP_UUID=$(cat /tmp/pp_uuid.txt)
          TEAM_ID=$(cat /tmp/team_id.txt)
          echo "Building IPA — Profile: $PP_UUID  Team: $TEAM_ID"
          if [ -d "App.xcworkspace" ]; then
            xcode-project build-ipa \
              --workspace "App.xcworkspace" \
              --scheme "App" \
              --xcargs "DEVELOPMENT_TEAM=$TEAM_ID PROVISIONING_PROFILE=$PP_UUID"
          else
            xcode-project build-ipa \
              --project "App.xcodeproj" \
              --scheme "App" \
              --xcargs "DEVELOPMENT_TEAM=$TEAM_ID PROVISIONING_PROFILE=$PP_UUID"
          fi
    artifacts:
      - apps/doctor-capacitor/ios/App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - Cliniq Testers
      slack:
        channel: '#general'
        notify_on_build_start: true
        notify:
          success: true
          failure: true

