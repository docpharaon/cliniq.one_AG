# ────────────────────────────────────────────────────────────
# Codemagic CI/CD — iOS Builds for cliniq.one Capacitor Apps
# ────────────────────────────────────────────────────────────
# All 4 apps are webview wrappers (server.url → Vercel).
# They need a placeholder www/ dir for Capacitor scaffolding.
# ────────────────────────────────────────────────────────────

workflows:
  # ─── DOCTOR iOS ─────────────────────────────────────────────
  doctor-ios:
    name: Doctor iOS
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: codemagic
    environment:
      xcode: latest
      node: 22
      groups:
        - supabase_credentials
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: disabled
          include: true
    scripts:
      - name: Install dependencies
        script: npm ci --legacy-peer-deps
      - name: Create placeholder webDir
        script: |
          mkdir -p apps/doctor-capacitor/www
          echo '<html><body>Loading...</body></html>' > apps/doctor-capacitor/www/index.html
      - name: Add and sync iOS platform
        script: |
          cd apps/doctor-capacitor
          ../../node_modules/.bin/cap add ios 2>&1 || echo "cap add finished (may already exist)"
          ../../node_modules/.bin/cap sync ios
          echo "=== iOS files generated ==="
          find ios -name "*.xcworkspace" -o -name "*.xcodeproj" 2>/dev/null | head -10
      - name: Debug - list iOS project structure
        script: |
          echo "=== iOS project structure ==="
          ls -la apps/doctor-capacitor/ios/App/ || echo "ios/App not found"
          echo "=== Looking for xcworkspace ==="
          find apps/doctor-capacitor/ios -name "*.xcworkspace" -o -name "*.xcodeproj" 2>/dev/null || echo "No xcode projects found"
      - name: Set up code signing
        script: |
          app-store-connect fetch-signing-files "com.cliniqone.doctor" \
            --type IOS_APP_STORE \
            --create
          keychain initialize
          keychain add-certificates
          xcode-project use-profiles
      - name: Build IPA
        script: |
          cd apps/doctor-capacitor/ios/App
          # Try xcworkspace first, fall back to xcodeproj
          if [ -d "App.xcworkspace" ]; then
            xcode-project build-ipa \
              --workspace "App.xcworkspace" \
              --scheme "App"
          else
            xcode-project build-ipa \
              --project "App.xcodeproj" \
              --scheme "App"
          fi
    artifacts:
      - apps/doctor-capacitor/ios/App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - Cliniq Testers
      slack:
        channel: '#general'
        notify_on_build_start: true
        notify:
          success: true
          failure: true

