# ────────────────────────────────────────────────────────────
# Codemagic CI/CD — iOS Builds for cliniq.one Capacitor Apps
# ────────────────────────────────────────────────────────────
# All 4 apps are webview wrappers (server.url → Vercel).
# They need a placeholder www/ dir for Capacitor scaffolding.
# ────────────────────────────────────────────────────────────

workflows:
  # ─── DOCTOR iOS ─────────────────────────────────────────────
  doctor-ios:
    name: Doctor iOS
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: codemagic
    environment:
      xcode: latest
      node: 22
      groups:
        - supabase_credentials
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
      cancel_previous_builds: true
    scripts:
      - name: Install dependencies
        script: npm ci --legacy-peer-deps
      - name: Create placeholder webDir
        script: |
          mkdir -p apps/doctor-capacitor/www
          echo '<html><body>Loading...</body></html>' > apps/doctor-capacitor/www/index.html
      - name: Add and sync iOS platform
        script: |
          cd apps/doctor-capacitor
          npx cap add ios || true
          npx cap sync ios
      - name: Debug - list iOS project structure
        script: |
          echo "=== iOS project structure ==="
          ls -la apps/doctor-capacitor/ios/App/ || echo "ios/App not found"
          echo "=== Looking for xcworkspace ==="
          find apps/doctor-capacitor/ios -name "*.xcworkspace" -o -name "*.xcodeproj" 2>/dev/null || echo "No xcode projects found"
      - name: Set up code signing
        script: |
          app-store-connect fetch-signing-files "com.cliniqone.doctor" \
            --type IOS_APP_STORE \
            --create
          keychain initialize
          app-store-connect certificates list \
            --type IOS_DISTRIBUTION \
            --certificate-key=@file:${HOME}/Library/MobileDevice/Certificates/*.p12 \
            2>/dev/null || app-store-connect certificates create \
            --type IOS_DISTRIBUTION \
            --save
          keychain add-certificates
          xcode-project use-profiles
      - name: Build IPA
        script: |
          cd apps/doctor-capacitor
          # Try xcworkspace first, fall back to xcodeproj
          if [ -d "ios/App/App.xcworkspace" ]; then
            xcode-project build-ipa \
              --workspace "ios/App/App.xcworkspace" \
              --scheme "App"
          else
            xcode-project build-ipa \
              --project "ios/App/App.xcodeproj" \
              --scheme "App"
          fi
    artifacts:
      - apps/doctor-capacitor/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - Cliniq Testers

