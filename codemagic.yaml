# ────────────────────────────────────────────────────────────
# Codemagic CI/CD — iOS Builds for cliniq.one Capacitor Apps
# ────────────────────────────────────────────────────────────
# Docs: https://docs.codemagic.io/yaml/yaml-getting-started/
#
# Required Codemagic environment variables (set in Codemagic UI):
#   APP_STORE_CONNECT_ISSUER_ID   — App Store Connect API Issuer ID
#   APP_STORE_CONNECT_KEY_ID      — App Store Connect API Key ID
#   APP_STORE_CONNECT_PRIVATE_KEY — App Store Connect API Private Key (.p8 contents)
#   CERTIFICATE_PRIVATE_KEY       — iOS Distribution Certificate private key (PEM)
#   NEXT_PUBLIC_SUPABASE_URL      — Supabase project URL
#   NEXT_PUBLIC_SUPABASE_ANON_KEY — Supabase anon key
#   EXPO_PUBLIC_SUPABASE_URL      — (for patient app) Supabase project URL
#   EXPO_PUBLIC_SUPABASE_ANON_KEY — (for patient app) Supabase anon key
# ────────────────────────────────────────────────────────────

definitions:
  environment: &ios_env
    xcode: latest
    node: 20
    cocoapods: default
  
  ios_signing: &ios_signing
    ios_signing:
      distribution_type: app_store
      bundle_identifier_pattern: com.cliniqone.*

  scripts:
    - &install_deps
      name: Install dependencies
      script: npm ci

    - &cap_add_ios
      name: Add iOS platform if missing
      script: |
        if [ ! -d "ios" ]; then
          npx cap add ios
        fi

    - &cap_sync_ios
      name: Sync Capacitor iOS
      script: npx cap sync ios

    - &install_cocoapods
      name: Install CocoaPods
      script: |
        cd ios/App
        pod install

    - &build_ipa
      name: Build iOS IPA
      script: |
        xcode-project build-ipa \
          --workspace "ios/App/App.xcworkspace" \
          --scheme "App" \
          --archive-flags="-destination 'generic/platform=iOS'"

  artifacts: &ios_artifacts
    - build/ios/ipa/*.ipa
    - /tmp/xcodebuild_logs/*.log
    - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

  publishing: &ios_publishing
    app_store_connect:
      auth: integration
      submit_to_testflight: true
      beta_groups:
        - "Cliniq Testers"

# ─── DOCTOR iOS ─────────────────────────────────────────────
workflows:
  doctor-ios:
    name: 🩺 Doctor iOS
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: codemagic
    environment:
      <<: *ios_env
      groups:
        - app_store_credentials
        - supabase_credentials
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.cliniqone.doctor
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
      cancel_previous_builds: true
    scripts:
      - *install_deps
      - name: Build doctor-web (static export)
        script: |
          cd apps/doctor-web
          npm run build
        environment:
          NEXT_PUBLIC_SUPABASE_URL: $NEXT_PUBLIC_SUPABASE_URL
          NEXT_PUBLIC_SUPABASE_ANON_KEY: $NEXT_PUBLIC_SUPABASE_ANON_KEY
      - name: Add & sync iOS platform
        script: |
          cd apps/doctor-capacitor
          if [ ! -d "ios" ]; then
            npx cap add ios
          fi
          npx cap sync ios
      - name: Install CocoaPods
        script: |
          cd apps/doctor-capacitor/ios/App
          pod install
      - name: Build IPA
        script: |
          cd apps/doctor-capacitor
          xcode-project build-ipa \
            --workspace "ios/App/App.xcworkspace" \
            --scheme "App"
    artifacts:
      - apps/doctor-capacitor/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      <<: *ios_publishing

