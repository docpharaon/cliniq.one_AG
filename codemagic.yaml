# ────────────────────────────────────────────────────────────
# Codemagic CI/CD — cliniq.one Capacitor Apps (iOS + Android)
# ────────────────────────────────────────────────────────────
# Each app builds its web source first, then bundles it into
# the native binary via `cap sync`. No server.url dependency.
#
# Account: docpharaon@gmail.com (temporary — pending
#          momen@momencrafts.com Google verification)
# ────────────────────────────────────────────────────────────

workflows:
  # ─── PATIENT iOS ────────────────────────────────────────────
  patient-ios:
    name: Patient iOS
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: codemagic
    environment:
      xcode: latest
      node: 22
      groups:
        - supabase_credentials
      vars:
        VITE_SUPABASE_URL: $NEXT_PUBLIC_SUPABASE_URL
        VITE_SUPABASE_ANON_KEY: $NEXT_PUBLIC_SUPABASE_ANON_KEY
        VITE_APP_ENV: production
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
      cancel_previous_builds: true
    scripts:
      - name: Install dependencies
        script: |
          npm ci --legacy-peer-deps
          # package-lock.json from Windows is missing macOS optional deps
          npm install @rollup/rollup-darwin-arm64 --no-save 2>/dev/null || true
      - name: Write patient .env
        script: |
          cat > apps/patient/.env << EOF
          VITE_SUPABASE_URL=${VITE_SUPABASE_URL:-$NEXT_PUBLIC_SUPABASE_URL}
          VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY:-$NEXT_PUBLIC_SUPABASE_ANON_KEY}
          VITE_GOOGLE_WEB_CLIENT_ID=${VITE_GOOGLE_WEB_CLIENT_ID:-115719888328-698lvlk0bkpo5l1ev3r6u18f9t7mtf8c.apps.googleusercontent.com}
          VITE_APP_ENV=production
          EOF
          echo "=== patient/.env ==="
          cat apps/patient/.env
      - name: Build patient web (Vite)
        script: |
          set -e
          cd apps/patient
          # Use vite build directly — skip tsc (type-check can fail on CI
          # due to monorepo deps, but the bundle builds fine)
          npx vite build
          echo "=== patient/dist contents ==="
          ls -la dist/ | head -20
          if [ ! -f dist/index.html ]; then
            echo "ERROR: dist/index.html not found!"
            exit 1
          fi
      - name: Add and sync iOS platform
        script: |
          cd apps/patient-capacitor

          # Save corrected Package.swift before cap sync (it regenerates with OS-specific paths)
          PKG_FILE="ios/App/CapApp-SPM/Package.swift"
          cp "$PKG_FILE" /tmp/Package.swift.bak 2>/dev/null || true

          ../../node_modules/.bin/cap add ios 2>&1 || echo "cap add finished (may already exist)"
          # cap sync/copy may fail if webDir doesn't exist — we handle the copy manually below
          ../../node_modules/.bin/cap sync ios 2>&1 || echo "cap sync failed (will copy assets manually)"
          ../../node_modules/.bin/cap copy ios 2>&1 || echo "cap copy failed (will copy assets manually)"

          # Restore corrected Package.swift (cap sync may have regenerated it with backslashes)
          if [ -f /tmp/Package.swift.bak ]; then
            cp /tmp/Package.swift.bak "$PKG_FILE"
            echo "Restored corrected Package.swift"
          fi
          # Safety net: fix any remaining backslash paths
          if grep -q '\\' "$PKG_FILE" 2>/dev/null; then
            sed -i '' 's|\\|/|g' "$PKG_FILE"
            echo "Fixed backslash paths in Package.swift"
          fi

          # Force-copy web assets to ios/App/App/public (gitignored, must always be recreated)
          APP_DIR="ios/App/App"
          rm -rf "$APP_DIR/public"
          mkdir -p "$APP_DIR/public"
          if [ -d "../patient/dist" ]; then
            cp -R ../patient/dist/* "$APP_DIR/public/" 2>/dev/null || cp -R ../patient/dist/. "$APP_DIR/public/"
            echo "Copied web assets from ../patient/dist"
          fi

          FILE_COUNT=$(find "$APP_DIR/public" -type f 2>/dev/null | wc -l)
          echo "public/ has $FILE_COUNT files"
          if [ "$FILE_COUNT" -eq 0 ]; then
            echo "ERROR: public/ is empty after copy!"
            ls -la ../patient/ 2>/dev/null || true
            ls -la ../patient/dist/ 2>/dev/null || true
            exit 1
          fi

          # Ensure capacitor.config.json exists
          if [ ! -f "$APP_DIR/capacitor.config.json" ]; then
            echo "Creating capacitor.config.json"
            echo '{"appId":"com.cliniqone.patient.cap","appName":"cliniq.one","webDir":"public","server":{"androidScheme":"https","iosScheme":"https"}}' > "$APP_DIR/capacitor.config.json"
          fi

          # Ensure config.xml exists (Xcode project references it)
          if [ ! -f "$APP_DIR/config.xml" ]; then
            echo "Creating stub config.xml"
            echo '<?xml version="1.0" encoding="UTF-8"?><widget id="com.cliniqone.patient.cap" version="1.0.0"><name>cliniq.one</name></widget>' > "$APP_DIR/config.xml"
          fi

          echo "=== iOS App contents ==="
          ls -la "$APP_DIR/"
          echo "=== public/ sample ==="
          ls "$APP_DIR/public/" | head -10
      - name: Set up code signing
        script: |
          # Generate a fresh private key for this build
          openssl genrsa -out /tmp/cert_key.pem 2048
          export CERTIFICATE_PRIVATE_KEY=$(cat /tmp/cert_key.pem)
          keychain initialize

          # Revoke ALL existing Distribution certificates so we can create
          # a fresh one that matches our newly generated private key.
          # (Apple limits the number of active Distribution certs.)
          echo "=== Revoking old Distribution certificates ==="
          app-store-connect certificates list \
            --type DISTRIBUTION \
            --state ISSUED \
            --save 2>/dev/null || true
          # Delete any saved certs (forces fresh creation)
          SAVED_CERTS=$(find ~/Library/MobileDevice/Certificates -name "*.p12" 2>/dev/null || true)
          echo "Saved certs: $SAVED_CERTS"

          # Use the CLI to revoke all distribution certs
          app-store-connect certificates list --type DISTRIBUTION 2>/dev/null | \
            awk '/serial:/ {print $2}' | while read SERIAL; do
              echo "Revoking cert serial: $SERIAL"
              app-store-connect certificates revoke "$SERIAL" 2>/dev/null || \
                echo "  (Could not revoke $SERIAL)"
            done || echo "No certificates to revoke"

          # Now fetch/create signing files — this will create a new cert
          app-store-connect fetch-signing-files "com.cliniqone.patient.cap" \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates

          PP_PATH=$(find ~/Library/Developer/Xcode/UserData/Provisioning\ Profiles ~/Library/MobileDevice/Provisioning\ Profiles -name "*.mobileprovision" 2>/dev/null | head -1)
          if [ -z "$PP_PATH" ]; then echo "ERROR: No provisioning profile found after fetch"; exit 1; fi
          security cms -D -i "$PP_PATH" > /tmp/pp.plist
          PP_UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" /tmp/pp.plist)
          TEAM_ID=$(/usr/libexec/PlistBuddy -c "Print :TeamIdentifier:0" /tmp/pp.plist)
          echo "Profile UUID: $PP_UUID  Team ID: $TEAM_ID"
          printf '%s' "$PP_UUID" > /tmp/pp_uuid.txt
          printf '%s' "$TEAM_ID" > /tmp/team_id.txt

          find apps/patient-capacitor/ios -name "project.pbxproj" | while read pbxf; do
            perl -i -pe "s/CODE_SIGN_STYLE = Automatic/CODE_SIGN_STYLE = Manual/g; s/DEVELOPMENT_TEAM = [^;]*;/DEVELOPMENT_TEAM = $TEAM_ID;/g;" "$pbxf"
            echo "Patched: $pbxf"
          done

          xcode-project use-profiles
      - name: Increment build number
        script: |
          BUILD_NUM=${PROJECT_BUILD_NUMBER:-$(($(date +%s) / 60))}
          echo "Build number: $BUILD_NUM"
          cd apps/patient-capacitor/ios/App
          agvtool new-version -all "$BUILD_NUM" 2>/dev/null || \
            find . -name "project.pbxproj" -exec perl -i -pe "s/CURRENT_PROJECT_VERSION = \\d+/CURRENT_PROJECT_VERSION = $BUILD_NUM/g" {} +
          agvtool new-marketing-version "1.0.0" 2>/dev/null || true
          echo "=== Version info ==="
          grep -E "CURRENT_PROJECT_VERSION|MARKETING_VERSION" App.xcodeproj/project.pbxproj || true
      - name: Patch Info.plist
        script: |
          PLIST="apps/patient-capacitor/ios/App/App/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$PLIST" 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Set :ITSAppUsesNonExemptEncryption false" "$PLIST"
          /usr/libexec/PlistBuddy -c "Delete :UIRequiredDeviceCapabilities" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UIRequiredDeviceCapabilities array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UIRequiredDeviceCapabilities:0 string arm64" "$PLIST"
          echo "=== Patched Info.plist ==="
          cat "$PLIST"

      - name: Build IPA
        script: |
          set -e
          cd apps/patient-capacitor/ios/App

          PP_UUID=$(cat /tmp/pp_uuid.txt)
          TEAM_ID=$(cat /tmp/team_id.txt)

          # 1. Resolve SPM dependencies first
          echo "=== Resolving SPM packages ==="
          xcodebuild -project "App.xcodeproj" \
            -scheme "App" \
            -resolvePackageDependencies \
            2>&1 | tail -20

          # 2. Archive
          echo "=== Archiving ==="
          xcodebuild archive \
            -project "App.xcodeproj" \
            -scheme "App" \
            -configuration Release \
            -archivePath "$CM_BUILD_DIR/App.xcarchive" \
            -destination "generic/platform=iOS" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            PROVISIONING_PROFILE="$PP_UUID" \
            -allowProvisioningUpdates

          # 3. Create ExportOptions.plist
          cat > /tmp/ExportOptions.plist <<EOPLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>
              <key>teamID</key>
              <string>${TEAM_ID}</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>com.cliniqone.patient.cap</key>
                  <string>${PP_UUID}</string>
              </dict>
              <key>signingStyle</key>
              <string>manual</string>
              <key>uploadBitcode</key>
              <false/>
              <key>uploadSymbols</key>
              <true/>
          </dict>
          </plist>
          EOPLIST

          # 4. Export IPA
          echo "=== Exporting IPA ==="
          xcodebuild -exportArchive \
            -archivePath "$CM_BUILD_DIR/App.xcarchive" \
            -exportPath "build/ios/ipa" \
            -exportOptionsPlist /tmp/ExportOptions.plist

          echo "=== IPA output ==="
          ls -la build/ios/ipa/
          IPA_COUNT=$(find build/ios/ipa -name "*.ipa" | wc -l)
          if [ "$IPA_COUNT" -eq 0 ]; then
            echo "ERROR: No IPA file produced!"
            exit 1
          fi
          echo "SUCCESS: Found $IPA_COUNT IPA file(s)"
    artifacts:
      - apps/patient-capacitor/ios/App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - Cliniq Testers
      email:
        recipients:
          - docpharaon@gmail.com
        notify:
          success: true
          failure: true

  # ─── PATIENT Android ────────────────────────────────────────
  patient-android:
    name: Patient Android
    instance_type: linux_x2
    max_build_duration: 60
    environment:
      node: 22
      java: 17
      groups:
        - supabase_credentials
        - android_signing
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
      cancel_previous_builds: true
    scripts:
      - name: Install dependencies
        script: npm ci --legacy-peer-deps
      - name: Build patient web (Vite)
        script: |
          cd apps/patient
          npm run build
          echo "=== patient/dist contents ==="
          ls -la dist/ | head -20
      - name: Add and sync Android platform
        script: |
          cd apps/patient-capacitor
          ../../node_modules/.bin/cap add android 2>&1 || echo "cap add finished (may already exist)"
          ../../node_modules/.bin/cap sync android
      - name: Build APK
        script: |
          cd apps/patient-capacitor/android
          if [ -n "$CM_KEYSTORE" ]; then
            echo "$CM_KEYSTORE" | base64 --decode > /tmp/keystore.jks
            export CM_KEYSTORE_PATH=/tmp/keystore.jks
            ./gradlew assembleRelease \
              -Pandroid.injected.signing.store.file="$CM_KEYSTORE_PATH" \
              -Pandroid.injected.signing.store.password="$CM_KEYSTORE_PASSWORD" \
              -Pandroid.injected.signing.key.alias="$CM_KEY_ALIAS" \
              -Pandroid.injected.signing.key.password="$CM_KEY_PASSWORD"
          else
            echo "No keystore found — building unsigned APK"
            ./gradlew assembleRelease
          fi
    artifacts:
      - apps/patient-capacitor/android/app/build/outputs/apk/**/*.apk
    publishing:
      email:
        recipients:
          - docpharaon@gmail.com
        notify:
          success: true
          failure: true

  # ─── DOCTOR iOS ─────────────────────────────────────────────
  doctor-ios:
    name: Doctor iOS
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: codemagic
    environment:
      xcode: latest
      node: 22
      groups:
        - supabase_credentials
    triggering:
      events: []
      cancel_previous_builds: true
    scripts:
      - name: Install dependencies
        script: npm ci --legacy-peer-deps
      - name: Build doctor web (Vite)
        script: |
          cd apps/doctor
          npm run build
          echo "=== doctor/dist contents ==="
          ls -la dist/ | head -20
      - name: Add and sync iOS platform
        script: |
          cd apps/doctor-capacitor
          ../../node_modules/.bin/cap add ios 2>&1 || echo "cap add finished (may already exist)"
          ../../node_modules/.bin/cap sync ios
          ../../node_modules/.bin/cap copy ios

          # Force-copy web assets to ios/App/App/public
          APP_DIR="ios/App/App"
          WEB_SRC="$CLONE_DIR/apps/doctor/dist"
          if [ -z "$CLONE_DIR" ]; then WEB_SRC="$(pwd)/../doctor/dist"; fi

          echo "=== Web source: $WEB_SRC ==="
          ls -la "$WEB_SRC/" 2>/dev/null | head -5 || echo "WARNING: web source not found at $WEB_SRC"

          rm -rf "$APP_DIR/public"
          mkdir -p "$APP_DIR/public"
          cp -R "$WEB_SRC"/* "$APP_DIR/public/" 2>/dev/null || cp -R "$WEB_SRC"/. "$APP_DIR/public/" 2>/dev/null || true
          
          # Verify public has content
          FILE_COUNT=$(find "$APP_DIR/public" -type f 2>/dev/null | wc -l)
          echo "public/ has $FILE_COUNT files"
          if [ "$FILE_COUNT" -eq 0 ]; then
            echo "ERROR: public/ is empty! Listing possible locations..."
            ls -la ../doctor/ 2>/dev/null || true
            ls -la ../doctor/dist/ 2>/dev/null || true
            exit 1
          fi

          # Ensure capacitor.config.json exists
          if [ ! -f "$APP_DIR/capacitor.config.json" ]; then
            echo "Creating capacitor.config.json"
            echo '{"appId":"com.cliniqone.doctor","appName":"cliniq.one Doctor","webDir":"public","server":{"androidScheme":"https","iosScheme":"https"}}' > "$APP_DIR/capacitor.config.json"
          fi

          # Ensure config.xml exists
          if [ ! -f "$APP_DIR/config.xml" ]; then
            echo "Creating stub config.xml"
            echo '<?xml version="1.0" encoding="UTF-8"?><widget id="com.cliniqone.doctor" version="1.0.0"><name>cliniq.one Doctor</name></widget>' > "$APP_DIR/config.xml"
          fi

          echo "=== iOS App contents ==="
          ls -la "$APP_DIR/"
      - name: Set up code signing
        script: |
          openssl genrsa -out /tmp/cert_key.pem 2048
          export CERTIFICATE_PRIVATE_KEY=$(cat /tmp/cert_key.pem)
          keychain initialize
          app-store-connect fetch-signing-files "com.cliniqone.doctor" \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates

          # Extract provisioning profile UUID + Team ID directly from the file
          PP_PATH=$(find ~/Library/Developer/Xcode/UserData/Provisioning\ Profiles ~/Library/MobileDevice/Provisioning\ Profiles -name "*.mobileprovision" 2>/dev/null | head -1)
          if [ -z "$PP_PATH" ]; then echo "ERROR: No provisioning profile found after fetch"; exit 1; fi
          security cms -D -i "$PP_PATH" > /tmp/pp.plist
          PP_UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" /tmp/pp.plist)
          TEAM_ID=$(/usr/libexec/PlistBuddy -c "Print :TeamIdentifier:0" /tmp/pp.plist)
          echo "Profile UUID: $PP_UUID  Team ID: $TEAM_ID"
          printf '%s' "$PP_UUID" > /tmp/pp_uuid.txt
          printf '%s' "$TEAM_ID" > /tmp/team_id.txt

          # Patch pbxproj: Manual signing + inject Team ID
          find apps/doctor-capacitor/ios -name "project.pbxproj" | while read pbxf; do
            perl -i -pe "s/CODE_SIGN_STYLE = Automatic/CODE_SIGN_STYLE = Manual/g; s/DEVELOPMENT_TEAM = [^;]*;/DEVELOPMENT_TEAM = $TEAM_ID;/g;" "$pbxf"
            echo "Patched: $pbxf"
          done

          xcode-project use-profiles
      - name: Patch Info.plist
        script: |
          PLIST="apps/doctor-capacitor/ios/App/App/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$PLIST" 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Set :ITSAppUsesNonExemptEncryption false" "$PLIST"
          /usr/libexec/PlistBuddy -c "Delete :UIRequiredDeviceCapabilities" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UIRequiredDeviceCapabilities array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UIRequiredDeviceCapabilities:0 string arm64" "$PLIST"
          echo "=== Patched Info.plist ==="
          cat "$PLIST"
      - name: Build IPA
        script: |
          cd apps/doctor-capacitor/ios/App
          if [ -d "App.xcworkspace" ]; then
            xcode-project build-ipa \
              --workspace "App.xcworkspace" \
              --scheme "App"
          else
            xcode-project build-ipa \
              --project "App.xcodeproj" \
              --scheme "App"
          fi
    artifacts:
      - apps/doctor-capacitor/ios/App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - Cliniq Testers
      email:
        recipients:
          - docpharaon@gmail.com
        notify:
          success: true
          failure: true

