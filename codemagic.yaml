              --workspace "App.xcworkspace" \
              --scheme "App" \
              --xcargs "DEVELOPMENT_TEAM=$TEAM_ID PROVISIONING_PROFILE=$PP_UUID"
          else
            xcode-project build-ipa \
              --project "App.xcodeproj" \
              --scheme "App" \
              --xcargs "DEVELOPMENT_TEAM=$TEAM_ID PROVISIONING_PROFILE=$PP_UUID"
          fi
    artifacts:
      - apps/admin-capacitor/ios/App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - Cliniq Testers
      email:
        recipients:
          - docpharaon@gmail.com
        notify:
          success: true
          failure: true

  # ─── ADMIN Android ──────────────────────────────────────────
  admin-android:
    name: Admin Android
    instance_type: linux_x2
    max_build_duration: 60
    environment:
      node: 22
      java: 17
      groups:
        - supabase_credentials
        - android_signing
    triggering:
      events: []
      cancel_previous_builds: true
    scripts:
      - name: Install dependencies
        script: npm ci --legacy-peer-deps
      - name: Build admin (static export)
        script: |
          cd apps/admin
          CAPACITOR_BUILD=1 npx next build
          echo "=== admin/out contents ==="
          ls -la out/ | head -20
      - name: Add and sync Android platform
        script: |
          cd apps/admin-capacitor
          ../../node_modules/.bin/cap add android 2>&1 || echo "cap add finished (may already exist)"
          ../../node_modules/.bin/cap sync android
      - name: Build APK
        script: |
          cd apps/admin-capacitor/android
          if [ -n "$CM_KEYSTORE" ]; then
            echo "$CM_KEYSTORE" | base64 --decode > /tmp/keystore.jks
            export CM_KEYSTORE_PATH=/tmp/keystore.jks
            ./gradlew assembleRelease \
              -Pandroid.injected.signing.store.file="$CM_KEYSTORE_PATH" \
              -Pandroid.injected.signing.store.password="$CM_KEYSTORE_PASSWORD" \
              -Pandroid.injected.signing.key.alias="$CM_KEY_ALIAS" \
              -Pandroid.injected.signing.key.password="$CM_KEY_PASSWORD"
          else
            echo "No keystore found — building unsigned APK"
            ./gradlew assembleRelease
          fi
    artifacts:
      - apps/admin-capacitor/android/app/build/outputs/apk/**/*.apk
    publishing:
      email:
        recipients:
          - docpharaon@gmail.com
        notify:
          success: true
          failure: true
