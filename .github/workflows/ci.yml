name: CI — Lint, Typecheck, Build, E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

jobs:
  install:
    name: Install Dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --legacy-peer-deps

  # ─── Next.js builds (admin + landing) ────────────────────
  build-nextjs:
    name: Build Next.js Apps
    needs: install
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [admin, landing]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --legacy-peer-deps
      - name: Build ${{ matrix.app }}
        run: cd apps/${{ matrix.app }} && npm run build
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-build
          path: apps/${{ matrix.app }}/.next
          retention-days: 1

  # ─── Expo web exports (doctor + patient) ────────────────
  build-expo:
    name: Build Expo Apps
    needs: install
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [doctor, patient]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --legacy-peer-deps
      - name: Export ${{ matrix.app }} web
        run: cd apps/${{ matrix.app }} && npx expo export --platform web
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

  # ─── E2E tests (admin only — Next.js server required) ──
  e2e:
    name: E2E Tests
    needs: build-nextjs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --legacy-peer-deps
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Download admin build
        uses: actions/download-artifact@v4
        with:
          name: admin-build
          path: apps/admin/.next
      - name: Start server & run tests
        run: |
          cd apps/admin && npm run start &
          sleep 10
          npm run test:e2e -- --project=admin-panel
      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
