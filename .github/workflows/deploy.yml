name: Deploy — All Web Apps + Supabase

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}

jobs:
  # ─── Supabase Migrations ──────────────────────────────────
  deploy-supabase:
    name: Deploy Supabase Migrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Push migrations
        continue-on-error: true
        run: supabase db push --linked
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

  # ─── Landing Page (cliniq.one) ─────────────────────────────
  deploy-landing:
    name: Deploy Landing Page
    needs: deploy-supabase
    if: always()
    runs-on: ubuntu-latest
    env:
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_LANDING }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --legacy-peer-deps
      - name: Install Vercel CLI
        run: npm install -g vercel@latest
      - name: Pull Vercel env
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: apps/landing
      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: apps/landing
      - name: Deploy
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: apps/landing

  # ─── Admin Panel (admin.cliniq.one) ────────────────────────
  deploy-admin:
    name: Deploy Admin Panel
    needs: deploy-supabase
    if: always()
    runs-on: ubuntu-latest
    env:
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_ADMIN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --legacy-peer-deps
      - name: Install Vercel CLI
        run: npm install -g vercel@latest
      - name: Pull Vercel env
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: apps/admin
      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: apps/admin
      - name: Deploy
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: apps/admin

  # ─── Doctor Portal (doctor.cliniq.one) ─────────────────────
  # Expo React Native app → static web export → Vercel static deploy
  deploy-doctor:
    name: Deploy Doctor Portal
    needs: deploy-supabase
    if: always()
    runs-on: ubuntu-latest
    env:
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_DOCTOR }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --legacy-peer-deps
      - name: Export Expo web build
        run: npx expo export --platform web
        working-directory: apps/doctor
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      - name: Prepare Vercel static deploy
        run: |
          # Copy the SPA rewrite config into dist for Vercel
          cp apps/doctor/vercel-deploy.json apps/doctor/dist/vercel.json
      - name: Install Vercel CLI
        run: npm install -g vercel@latest
      - name: Deploy static site to Vercel
        run: |
          vercel deploy apps/doctor/dist \
            --prod \
            --yes \
            --token=${{ secrets.VERCEL_TOKEN }} \
            --name=cliniq-doctor-web

  # ─── Patient Portal (patient.cliniq.one) ───────────────────
  # Expo React Native app → static web export → Vercel static deploy
  deploy-patient:
    name: Deploy Patient Portal
    needs: deploy-supabase
    if: always()
    runs-on: ubuntu-latest
    env:
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_PATIENT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --legacy-peer-deps
      - name: Export Expo web build
        run: npx expo export --platform web
        working-directory: apps/patient
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      - name: Prepare Vercel static deploy
        run: |
          # Copy the SPA rewrite config into dist for Vercel
          cp apps/patient/vercel-deploy.json apps/patient/dist/vercel.json
      - name: Install Vercel CLI
        run: npm install -g vercel@latest
      - name: Deploy static site to Vercel
        run: |
          vercel deploy apps/patient/dist \
            --prod \
            --yes \
            --token=${{ secrets.VERCEL_TOKEN }} \
            --name=cliniq-patient-web

  # ─── Edge Functions ────────────────────────────────────────
  deploy-edge-functions:
    name: Deploy Edge Functions
    needs: deploy-supabase
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy all edge functions
        run: |
          supabase functions deploy ai-intake --linked
          supabase functions deploy approve-tester --linked
          supabase functions deploy delete-account --linked
          supabase functions deploy kyc-token --linked
          supabase functions deploy kyc-webhook --linked
          supabase functions deploy register-tester --linked
          supabase functions deploy send-notification --linked
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
