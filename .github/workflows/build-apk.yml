name: Build Capacitor APKs

on:
  workflow_dispatch:
    inputs:
      app:
        description: 'App to build'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - doctor
          - admin
          - patient
  push:
    branches: [main]
    paths:
      - 'apps/doctor/**'
      - 'apps/admin/**'
      - 'apps/patient/**'
      - 'apps/doctor-capacitor/**'
      - 'apps/admin-capacitor/**'
      - 'apps/patient-capacitor/**'
      - 'packages/**'

env:
  NODE_VERSION: '20'
  JAVA_VERSION: '17'

jobs:
  # ─── Build Doctor APK ──────────────────────────
  build-doctor:
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.app == 'all' || inputs.app == 'doctor') || github.event_name == 'push' }}
    runs-on: ubuntu-latest
    name: 🩺 Doctor APK
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build doctor web (Expo export)
        working-directory: apps/doctor
        run: npx expo export --platform web
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Sync Capacitor
        working-directory: apps/doctor-capacitor
        run: npx cap sync android

      - name: Build APK
        working-directory: apps/doctor-capacitor/android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: doctor-apk-${{ github.sha }}
          path: apps/doctor-capacitor/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

  # ─── Build Admin APK ──────────────────────────
  build-admin:
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.app == 'all' || inputs.app == 'admin') || github.event_name == 'push' }}
    runs-on: ubuntu-latest
    name: 🛡️ Admin APK
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build admin (static export)
        working-directory: apps/admin
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Sync Capacitor
        working-directory: apps/admin-capacitor
        run: npx cap sync android

      - name: Build APK
        working-directory: apps/admin-capacitor/android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: admin-apk-${{ github.sha }}
          path: apps/admin-capacitor/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

  # ─── Build Patient APK ─────────────────────────
  build-patient:
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.app == 'all' || inputs.app == 'patient') || github.event_name == 'push' }}
    runs-on: ubuntu-latest
    name: 📱 Patient APK
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build patient web (static export)
        working-directory: apps/patient
        run: npx expo export --platform web
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Sync Capacitor
        working-directory: apps/patient-capacitor
        run: npx cap sync android

      - name: Build APK
        working-directory: apps/patient-capacitor/android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: patient-apk-${{ github.sha }}
          path: apps/patient-capacitor/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
